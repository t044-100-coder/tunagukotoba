<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>つなぐ言葉レスキュー隊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      /* スマホ等でのテキスト選択やハイライトを防止してアプリ感を出す */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ルビ（ふりがな）のスタイル調整 */
    ruby { ruby-align: center; }
    rt { font-size: 0.65em; color: #4b5563; }

    /* アニメーション定義 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(0.5) translateY(20px); opacity: 0; }
      60% { transform: scale(1.2) translateY(-10px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-pop {
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 背景のアニメーション */
    @keyframes cloudMove {
      from { background-position: 0 0; }
      to { background-position: 1000px 0; }
    }
    .bg-clouds {
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 60%);
      background-size: 150px 150px;
      animation: cloudMove 40s linear infinite;
    }
  </style>
</head>
<body class="bg-gray-200 m-0 p-0 h-screen overflow-hidden">

  <!-- アプリのメインコンテナ（スマホサイズに制限して中央配置） -->
  <div id="app" class="w-full h-full max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative">
    <!-- JavaScriptでここに画面が描画されます -->
  </div>

  <script>
    // --- 問題データ（教科書の内容をベースに作成） ---
    const questions = [
      {
        pre: "部屋が暗かった。",
        post: "、<ruby>照明<rt>しょうめい</rt></ruby>をつけた。",
        options: ["だから", "しかし", "それに"],
        answer: 0
      },
      {
        pre: "雪がふった。",
        post: "、積もらなかった。",
        options: ["だから", "しかし", "それに"],
        answer: 1
      },
      {
        pre: "姉はピアノが上手だ。",
        post: "、サッカーも得意だ。",
        options: ["だから", "しかし", "それに"],
        answer: 2
      },
      {
        pre: "日差しが強い。",
        post: "、すずしく感じる。",
        options: ["だから", "でも", "さらに"],
        answer: 1
      },
      {
        pre: "雨がふり始めた。",
        post: "、風も強くなってきた。",
        options: ["だから", "けれども", "さらに"],
        answer: 2
      },
      {
        pre: "今日は<ruby>祝日<rt>しゅくじつ</rt></ruby>だ。",
        post: "、学校は休みだ。",
        options: ["だから", "しかし", "それに"],
        answer: 0
      },
      {
        pre: "毎日<ruby>練習<rt>れんしゅう</rt></ruby>を続けた",
        post: "、試合に勝つことができた。",
        options: ["ので", "が", "さらに"],
        answer: 0
      },
      {
        pre: "食パンを買いに出かけた",
        post: "、パン屋さんは休みだった。",
        options: ["ので", "が", "から"],
        answer: 1
      },
      {
        pre: "この山には<ruby>熊<rt>くま</rt></ruby>や<ruby>鹿<rt>しか</rt></ruby>がいる",
        post: "、注意が必要だ。",
        options: ["から", "けれど", "さらに"],
        answer: 0
      },
      {
        pre: "外は寒い",
        post: "、とても暗い。",
        options: ["ので", "けれども", "し"],
        answer: 2
      }
    ];

    // --- 状態管理 ---
    const app = document.getElementById('app');
    let currentQuestionIndex = 0;
    let score = 0;
    let currentAttempt = 0; // その問題で何回間違えたか
    let isAnimating = false;

    // --- 効果音（Web Audio APIを使用。外部ファイル不要） ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCorrectSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
      osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); // C#6
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function playWrongSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
      osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.2); 
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.4);
    }

    // --- 画面描画関数 ---

    // 1. スタート画面
    function renderStart() {
      app.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-center space-y-8 px-6 bg-gradient-to-b from-cyan-100 to-blue-200 bg-clouds relative">
          <div class="text-7xl animate-bounce drop-shadow-lg z-10">🌉🏃‍♂️</div>
          <h1 class="text-4xl font-black text-blue-800 drop-shadow-md leading-tight z-10">
            つなぐ言葉<br><span class="text-amber-500 text-5xl inline-block mt-2">レスキュー隊！</span>
          </h1>
          <div class="bg-white/90 p-5 rounded-2xl shadow-lg border-2 border-white z-10">
            <p class="text-gray-700 font-bold leading-relaxed text-sm md:text-base">
              言葉の橋がこわれてしまって、<br>文と文がまいごになっているよ！<br>
              正しい<span class="text-blue-600">「つなぐ言葉」</span>をえらんで、<br>橋を直してあげよう。
            </p>
          </div>
          <button onclick="startGame()" class="z-10 bg-pink-500 hover:bg-pink-600 text-white text-xl font-bold py-4 px-12 rounded-full shadow-[0_6px_0_#be185d] active:shadow-[0_0px_0_#be185d] active:translate-y-[6px] transition-all">
            ゲームスタート！
          </button>
        </div>
      `;
    }

    // ゲーム開始処理
    function startGame() {
      initAudio();
      currentQuestionIndex = 0;
      score = 0;
      renderGame();
    }

    // 2. プレイ画面
    function renderGame() {
      const q = questions[currentQuestionIndex];
      currentAttempt = 0;
      isAnimating = false;
      
      app.innerHTML = `
        <div class="flex flex-col h-full w-full bg-gradient-to-b from-cyan-300 to-blue-100 p-4 pt-6 relative">
          
          <!-- ヘッダー（進行度とスコア） -->
          <div class="flex justify-between items-center mb-4 z-10">
             <div class="bg-white/90 rounded-full px-4 py-2 font-bold text-blue-700 shadow-sm flex items-center gap-3">
                <span>第 ${currentQuestionIndex + 1} 問</span>
                <div class="w-20 h-2 bg-gray-200 rounded-full overflow-hidden">
                   <div class="h-full bg-blue-500 transition-all duration-500" style="width: ${(currentQuestionIndex / questions.length) * 100}%"></div>
                </div>
             </div>
             <div class="bg-white/90 rounded-full px-4 py-2 font-bold text-pink-600 shadow-sm flex items-center gap-1">
                <span>🏅</span> ${score}
             </div>
          </div>
          
          <!-- メインビジュアル（島と橋） -->
          <div class="flex-grow flex flex-col justify-center relative mt-2 mb-6">
             <div class="flex justify-between items-end relative w-full mb-8 px-1">
                
                <!-- 左の島（前の文） -->
                <div class="w-5/12 flex flex-col items-center z-10">
                   <div class="bg-white p-3 rounded-2xl shadow-lg border-b-4 border-blue-200 text-sm md:text-base font-bold text-gray-800 mb-3 w-full text-center relative leading-loose min-h-[5rem] flex items-center justify-center">
                      ${q.pre}
                      <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b-4 border-r-4 border-blue-200 rotate-45 rounded-sm"></div>
                   </div>
                   <div class="text-6xl md:text-7xl drop-shadow-lg translate-y-2">🏝️</div>
                </div>

                <!-- 橋 -->
                <div class="absolute left-1/2 transform -translate-x-1/2 bottom-[1.5rem] w-[30%] flex flex-col items-center justify-end z-0">
                   <div id="bridge-text" class="bg-yellow-100 border-2 border-yellow-400 text-yellow-800 font-black px-4 py-1.5 rounded-lg shadow-sm z-20 mb-3 -translate-y-5 whitespace-nowrap text-sm md:text-base transition-all duration-300">？</div>
                   <!-- 点線の壊れた橋 -->
                   <div id="bridge-line" class="w-full border-t-[6px] border-dashed border-slate-400/80 absolute bottom-4 rounded"></div>
                   <!-- 正解時に現れる実線の橋 -->
                   <div id="bridge-solid" class="w-full h-3 bg-amber-700 absolute bottom-[0.85rem] rounded opacity-0 transition-opacity duration-300 scale-x-0 origin-left"></div>
                </div>

                <!-- 走るキャラクター -->
                <div id="runner" class="absolute bottom-[2.5rem] left-[15%] text-4xl md:text-5xl z-20 transition-all duration-[1000ms] ease-in-out drop-shadow-md">🏃‍♂️</div>

                <!-- 右の島（後の文） -->
                <div class="w-5/12 flex flex-col items-center z-10">
                   <div class="bg-white p-3 rounded-2xl shadow-lg border-b-4 border-green-200 text-sm md:text-base font-bold text-gray-800 mb-3 w-full text-center relative leading-loose min-h-[5rem] flex items-center justify-center">
                      ${q.post}
                      <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b-4 border-r-4 border-green-200 rotate-45 rounded-sm"></div>
                   </div>
                   <div class="text-6xl md:text-7xl drop-shadow-lg translate-y-2">🏝️</div>
                </div>
             </div>
             
             <!-- ⭕❌ フィードバック -->
             <div id="feedback" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 z-50">
                <span id="feedback-icon" class="text-9xl font-black drop-shadow-[0_10px_20px_rgba(0,0,0,0.2)]"></span>
             </div>
          </div>

          <!-- 選択肢ボタン -->
          <div id="options" class="flex flex-col gap-3 pb-6 px-2 w-full mx-auto mt-auto z-10">
             ${q.options.map((opt, i) => `
                <button onclick="handleSelect(${i})" id="btn-${i}" class="option-btn bg-white hover:bg-blue-50 text-blue-800 font-bold text-lg py-3.5 px-6 rounded-2xl shadow-[0_5px_0_#93c5fd] border-2 border-blue-200 active:shadow-[0_0px_0_#93c5fd] active:translate-y-[5px] transition-all w-full flex items-center justify-center">
                   ${opt}
                </button>
             `).join('')}
          </div>
        </div>
      `;
    }

    // 選択肢がクリックされた時の処理
    function handleSelect(index) {
      if (isAnimating) return;
      isAnimating = true;

      if(audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
      }

      const q = questions[currentQuestionIndex];
      const bridgeText = document.getElementById('bridge-text');
      const bridgeSolid = document.getElementById('bridge-solid');
      const runner = document.getElementById('runner');
      const feedback = document.getElementById('feedback');
      const feedbackIcon = document.getElementById('feedback-icon');
      const btn = document.getElementById(`btn-${index}`);

      bridgeText.textContent = q.options[index];

      if (index === q.answer) {
        // --- 正解 ---
        if (currentAttempt === 0) score++; // 1回目で正解した時だけスコアアップ
        playCorrectSound();
        
        // ボタンのデザイン変更
        btn.classList.replace('bg-white', 'bg-green-400');
        btn.classList.replace('text-blue-800', 'text-white');
        btn.classList.replace('border-blue-200', 'border-green-500');
        btn.classList.replace('shadow-[0_5px_0_#93c5fd]', 'shadow-[0_5px_0_#16a34a]');

        // 橋がかかるアニメーション
        bridgeSolid.classList.remove('opacity-0');
        bridgeSolid.style.transform = 'scaleX(1)';
        bridgeText.classList.add('bg-amber-400', 'border-amber-600', 'text-amber-900');

        // キャラクターが渡るアニメーション
        setTimeout(() => {
          runner.style.left = '72%';
        }, 200);

        // ⭕マーク表示
        feedbackIcon.textContent = '⭕';
        feedbackIcon.className = 'text-[10rem] font-black text-red-500 drop-shadow-[0_0_20px_rgba(255,255,255,0.9)] animate-pop';
        feedback.classList.remove('opacity-0');

        // 次の問題へ
        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questions.length) {
            renderGame();
          } else {
            renderResult();
          }
        }, 2200);

      } else {
        // --- 不正解 ---
        currentAttempt++;
        playWrongSound();
        
        // ボタンをグレーアウト
        btn.classList.replace('bg-white', 'bg-gray-200');
        btn.classList.replace('text-blue-800', 'text-gray-500');
        btn.classList.replace('border-blue-200', 'border-gray-300');
        btn.classList.replace('shadow-[0_5px_0_#93c5fd]', 'shadow-[0_5px_0_#9ca3af]');
        btn.classList.add('opacity-70', 'pointer-events-none'); // 押せなくする

        // 橋が揺れるアニメーション
        bridgeText.classList.add('animate-shake', 'bg-red-200', 'border-red-400', 'text-red-800');
        
        // ❌マーク表示
        feedbackIcon.textContent = '❌';
        feedbackIcon.className = 'text-[10rem] font-black text-blue-600 drop-shadow-[0_0_20px_rgba(255,255,255,0.9)] animate-pop';
        feedback.classList.remove('opacity-0');

        // 少し待ってから元の状態（再選択可能）に戻す
        setTimeout(() => {
          bridgeText.classList.remove('animate-shake', 'bg-red-200', 'border-red-400', 'text-red-800');
          bridgeText.textContent = '？';
          feedback.classList.add('opacity-0');
          isAnimating = false; // 再選択可能にする
        }, 1200);
      }
    }

    // 3. リザルト画面
    function renderResult() {
      let message = "";
      let emoji = "";
      
      // スコアに応じたメッセージ
      if (score === questions.length) {
        message = "つなぐ言葉マスター！<br>パーフェクト！";
        emoji = "🏆✨";
      } else if (score >= questions.length * 0.7) {
        message = "すごい！<br>あと少しでマスターだ！";
        emoji = "🌟";
      } else {
        message = "がんばったね！<br>もう一回ちょうせんしよう！";
        emoji = "👍";
      }

      app.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-center space-y-6 px-6 bg-gradient-to-b from-yellow-100 to-orange-100 w-full">
          <div class="text-[6rem] animate-bounce drop-shadow-md">${emoji}</div>
          <h2 class="text-3xl font-black text-orange-600 drop-shadow-sm border-b-4 border-orange-300 pb-2">ゲームクリア！</h2>
          
          <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full border-4 border-orange-200 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-xs font-bold px-3 py-1 rounded-bl-lg">1回で正解した数</div>
            <p class="text-gray-500 font-bold mb-1 mt-2">あなたのスコア</p>
            <div class="text-6xl font-black text-blue-600 mb-4">${score} <span class="text-2xl text-gray-400">/ ${questions.length}</span></div>
            <p class="text-lg md:text-xl font-bold text-gray-800 leading-relaxed">${message}</p>
          </div>

          <button onclick="startGame()" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white text-xl font-bold py-4 px-10 rounded-full shadow-[0_6px_0_#c2410c] active:shadow-[0_0px_0_#c2410c] active:translate-y-[6px] transition-all">
            もういちどあそぶ
          </button>
        </div>
      `;
    }

    // 初期化（アプリ起動時）
    renderStart();

  </script>
</body>
</html>
